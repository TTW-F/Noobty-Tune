server {
    listen 80;
    listen [::]:80;
    server_name tune.noobty.top;

    root /srv/noobty-tune/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/noobty-tune.access.log;
    error_log /var/log/nginx/noobty-tune.error.log warn;
}
