# ============================================================
# 前端站点:tune.noobty.top
# 运行于:云服务器 106.14.175.93(实机部署于 /usr/local/nginx/conf/conf.d/tune.conf,本文件为版本管理参考副本)
# 静态根:/srv/noobty-tune/current(由 deploy.sh 原子切换)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name tune.noobty.top;

    # certbot webroot 续期通道
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/noobty-tune.access.log;
    error_log /var/log/nginx/noobty-tune.error.log warn;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tune.noobty.top;

    ssl_certificate     /etc/letsencrypt/live/tune.noobty.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tune.noobty.top/privkey.pem;

    root /srv/noobty-tune/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物带内容哈希,可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/noobty-tune.access.log;
    error_log /var/log/nginx/noobty-tune.error.log warn;
}
