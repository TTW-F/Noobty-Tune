# ============================================================
# 后端站点:backend.tune.noobty.top
# 运行于:云服务器 106.14.175.93(实机部署于 /usr/local/nginx/conf/conf.d/tune.conf,本文件为版本管理参考副本)
#
# 拓扑说明:后端真实进程运行在内网机 192.168.31.35,
# 通过 frpc 隧道注册到云机 frps,把内网 127.0.0.1:3101
# 映射为云机的 127.0.0.1:3101。因此这里的 proxy_pass
# 目标保持 127.0.0.1:3101 不变,上游实际是 frp 隧道。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name backend.tune.noobty.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/backend-tune.noobty.top.access.log;
    error_log /var/log/nginx/backend-tune.noobty.top.error.log warn;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backend.tune.noobty.top;

    ssl_certificate     /etc/letsencrypt/live/tune.noobty.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tune.noobty.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/backend-tune.noobty.top.access.log;
    error_log /var/log/nginx/backend-tune.noobty.top.error.log warn;
}
