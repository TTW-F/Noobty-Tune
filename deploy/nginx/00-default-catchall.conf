# ============================================================
# 串站防护兜底站点(必须最先加载)
#
# 原理:nginx 对每个端口都有一个"隐式默认站点"——当请求的 Host
# 匹配不到任何 server_name(直接用 IP 访问、或别的域名解析到本机
# 但本机没有对应 server 块)时,nginx 会把请求交给加载顺序最前的
# conf,这就是"其他项目域名被导到本项目"的根因。
#
# 本文件以 `00-` 开头,保证在 sites-enabled 中第一个被加载,
# 用 default_server 显式接管所有未匹配流量并直接断开连接(444)。
#
# 注意:
# 1. default_server 每端口只能有一个。若服务器上已有其他项目占用,
#    不要再启用本文件的对应端口段,改为核对该项目兜底配置。
# 2. 443 的 default_server 必须持有一张证书才能启动;复用本项目的
#    证书即可(SNI 不匹配的请求无论如何都会被 444 断开)。
# 3. 首次签发证书前可先注释 443 段,签发完成后恢复并 nginx -t。
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 = nginx 特有:不返回任何内容直接断开,让扫描器和误配域名拿不到任何响应
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/tune.noobty.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tune.noobty.top/privkey.pem;

    return 444;
}
