# ============================================================
# frps 服务端配置 —— 运行于云服务器 106.14.175.93
#
# 职责:接收内网机 192.168.31.35 上 frpc 的隧道注册,
# 把云机的 127.0.0.1:3101 反向映射到内网机的后端端口,
# 供本机 nginx (backend.tune.noobty.top) 反向代理使用。
#
# 上线前必改:auth.token 换成强随机串(与 frpc.toml 保持一致)
# ============================================================

bindAddr = "0.0.0.0"
bindPort = 7500

auth.token = "CHANGE_ME_TO_A_STRONG_RANDOM_TOKEN"

# 只允许映射本项目后端端口,防止隧道被滥用
[[allowPorts]]
start = 3101
end = 3101
