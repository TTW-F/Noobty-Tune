# ============================================================
# frps 服务端参考模板 —— 与云机 106.14.175.93 实际部署一致
# 实际位置:/opt/frp-noobty/frps.toml(systemd 单元 frps.service)
#
# 注意:隧道通道是 7000;7500 是管理面板(仅限本机/内网访问,
# 云机已用 iptables 阻断外网)。
# ============================================================

bindAddr = "0.0.0.0"
bindPort = 7000
vhostHTTPPort = 8080

auth.method = "token"
auth.token = "CHANGE_ME_KEEP_IN_SYNC_WITH_FRPC"

log.to = "./frps.log"
log.level = "info"

webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "CHANGE_ME_WEAK_DEFAULT_IS_DANGEROUS"
